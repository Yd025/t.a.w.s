version: 1
applications:
  - appRoot: taws
    customRules:
      - source: /v1/chat
        target: https://x12ljhcpxf.execute-api.us-east-1.amazonaws.com/v1/chat
        status: '200'
    backend:
      phases:
        build:
          commands:
            - export CI=1
            - nvm use 22
            - npm install
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*

version: 1
applications:
  - appRoot: taws
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm install
            - npx ampx generate outputs --app-id $AWS_APP_ID --branch $AWS_BRANCH
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*